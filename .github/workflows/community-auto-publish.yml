# Automatic PGN/EPD-only publication from forked contributor PRs.
# SECURITY: NEVER checkout untrusted PR head; execute main-branch code only.
name: Auto-publish community PGN & EPD

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: openfishtest-community-publications
  cancel-in-progress: false

jobs:
  publish-legal-pgn-epd:
    if: \${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ONLY trusted main scripts (never PR head)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted main-branch PGN parser
        run: python -m pip install -r requirements.txt
      - name: Validate immutable Git blobs; auto-publish safe data
        env:
          GITHUB_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_EVENT_PATH: \${{ github.event_path }}
        run: python community_publish.py
