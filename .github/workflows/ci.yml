name: API checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q server.py jobs_api.py worker.py match_protocol.py engine_stats.py public_games.py archive.py publish_snapshot.py tests
      - run: node --check docs/app.js
      - run: node --check docs/i18n.js
      - run: node scripts/check-i18n.cjs
      - run: python -m pytest -q
